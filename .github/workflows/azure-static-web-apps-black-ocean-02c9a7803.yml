name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # ── Backend: Setup & Test ──────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore
        working-directory: ./backend/FlashCardTool

      - name: Run Backend Tests
        run: |
          dotnet test \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults
        working-directory: ./backend/FlashCardTool

      # ── Backend: DB Migration ──────────────────────────────
      - name: Install EF Tools
        run: dotnet tool install --global dotnet-ef

      - name: Run Migrations
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          cd $GITHUB_WORKSPACE/backend/FlashCardTool
          dotnet ef database update \
            --startup-project FlashCardTool.API \
            --project FlashCardTool.Infrastructure \
            --context DataHubContext \
            --verbose
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          Jwt__Key: ${{ secrets.JWT_KEY }}
          Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
          Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}
          ApplicationInsights__ConnectionString: ${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}

      # ── Backend: Build & Push Docker Image ────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name flashcardsappacr

      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t flashcardsappacr.azurecr.io/flashcards-api:latest \
            -t flashcardsappacr.azurecr.io/flashcards-api:${{ github.sha }} \
            --push \
            ./backend/FlashCardTool

      # ── Backend: Update Container App ─────────────────────
      - name: Update Container App
        run: |
          echo "Waiting for any active provisioning to complete..."
          sleep 60
          az containerapp update \
            --name flashcards-api \
            --resource-group flashcardsapp-rg \
            --image flashcardsappacr.azurecr.io/flashcards-api:${{ github.sha }}

      # ── Frontend ──────────────────────────────────────────
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Generate TypeScript Types
        run: |
              npx openapi-typescript@6.7.6 https://api.flash-learn.online/swagger/v1/swagger.json --output src/types/api.generated.ts
              node -e "const fs=require('fs');const g=fs.readFileSync('src/types/api.generated.ts','utf8');const m=(g.match(/(\w+):\s*\{/g)||[]).map(x=>x.replace(/:\s*\{/,'').trim()).filter(n=>n!=='schemas'&&n!=='components').filter((n,i,s)=>s.indexOf(n)===i).filter(n=>/^[A-Z][a-zA-Z]+$/.test(n));const c='// Auto generated\nimport type { components } from \'./api.generated\';\n\n'+m.map(n=>'export type '+n+' = components[\'schemas\'][\''+n+'\'];').join('\n');fs.writeFileSync('src/types/index.ts',c);console.log('Generated '+m.length+' types');"
        working-directory: ./frontend

      - name: TypeScript Type Check
        run: npx tsc --noEmit
        working-directory: ./frontend
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_OCEAN_02C9A7803 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: ""
          output_location: "build"
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_OCEAN_02C9A7803 }}
          action: "close"
